policy:
  # Absolute path to TorchScript .pt file. Override at launch with:
  #   ros2 launch legged_control robot.launch.py mode:=policy model_path:=/path/to/policy.pt
  # B+C policy: 138-dim input (46-dim single frame × 3 frame stack), 4*tanh squashing.
  model_path: "__package__/models/08_bc_mujoco_recovered_policy.pt"

  # Default stance pose in URDF frame (training convention), yaml joint order.
  # From dog_urdf_config.default_joint_angles: hip=0.1, front thigh=0.8, rear thigh=1.0,
  # calf=-1.5. Used as the offset subtracted from joint feedback in the obs.
  # IMPORTANT: verify against hardware in passive mode before first policy run.
  joint_default_q_urdf:
    FR_hip:    0.1
    FR_thigh:  0.8
    FR_calf:  -1.5
    FL_hip:    0.1
    FL_thigh:  0.8
    FL_calf:  -1.5
    RR_hip:    0.1
    RR_thigh:  1.0
    RR_calf:  -1.5
    RL_hip:    0.1
    RL_thigh:  1.0
    RL_calf:  -1.5

  # Uniform action scale (dog_urdf_config.control.action_scale = 0.25).
  # Raw policy output is already 4*tanh(...) (range +/-4), so the joint residual
  # range is +/-1.0 rad around default_q.
  action_scale:
    FR_hip:   0.25
    FR_thigh: 0.25
    FR_calf:  0.25
    FL_hip:   0.25
    FL_thigh: 0.25
    FL_calf:  0.25
    RR_hip:   0.25
    RR_thigh: 0.25
    RR_calf:  0.25
    RL_hip:   0.25
    RL_thigh: 0.25
    RL_calf:  0.25

  # Joints where the training URDF sign differs from the deployment URDF.
  # Empty: robot.yaml direction/zero_offset already maps the motor frame to the
  # training URDF frame, so no extra hip flip is applied. (Verify in passive mode.)
  hip_sign_flip: []
