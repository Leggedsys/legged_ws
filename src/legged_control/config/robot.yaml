# Robot configuration for quadruped with 12 Unitree GO-M8010-6 motors.
#
# gear_ratio: total reduction ratio from joint to motor shaft.
#   motor_bus_node divides readings by gear_ratio and multiplies commands by gear_ratio.
#   If omitted, falls back to sdk.queryGearRatio() (motor internal ratio only).
#
# PD gains are applied by the motor driver:
#   tau = kp * (target_q - q_actual) + kd * (0 - dq_actual)
#
# direction / zero_offset: URDF alignment.
#   q_urdf = direction * q_motor + zero_offset
#   direction:   +1 if motor positive direction == URDF positive direction, -1 if reversed.
#   zero_offset: static offset in URDF frame (rad); calibrated in passive mode.
#
# q_min / q_max: hardware angle limits in URDF frame (rad).
#   motor_command_bridge clips /joint_commands before converting to motor frame.
#
# Calibration procedure: see legged_control/test/README.md

joints:
  # Canonical order for observation/action vectors (index 0-11)
  - name: FR_hip
    motor_id: 0
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    -1
    zero_offset:  0.105

  - name: FR_thigh
    motor_id: 1
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  1.8
    direction:    -1
    zero_offset:  1.08

  - name: FR_calf
    motor_id: 2
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9   # symmetric with rear calves (was -0.27); see control: calf-limit note
    direction:    1
    zero_offset:  -2.7

  - name: FL_hip
    motor_id: 3
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    1
    zero_offset:  0.105

  - name: FL_thigh
    motor_id: 4
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  1.8
    direction:    1
    zero_offset:  1.08

  - name: FL_calf
    motor_id: 5
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9    # symmetric with rear calves (was -0.27); see control: calf-limit note
    direction:    -1
    zero_offset:  -2.7

  - name: RR_hip
    motor_id: 6
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    1
    zero_offset:  0.105

  - name: RR_thigh
    motor_id: 7
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  2.0
    direction:    -1
    zero_offset:  1.08

  - name: RR_calf
    motor_id: 11
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9
    direction:    1
    zero_offset:  -2.7

  - name: RL_hip
    motor_id: 9
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    -1
    zero_offset:  0.105

  - name: RL_thigh
    motor_id: 10
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  2.0
    direction:    1
    zero_offset:  1.08

  - name: RL_calf
    motor_id: 8
    gear_ratio: 12.66
    q_min: -2.65
    q_max: -0.9
    direction:    -1
    zero_offset:  -2.7

control:
  # 关节限位只有一道：motor_command_bridge 按本文件每关节 q_min/q_max 裁剪
  # /joint_commands（policy_node 内的 policy.yaml 软限位裁剪已在 aa900e2 移除）。
  # 四条腿保持对称。calf 上限四腿统一 -0.9（之前 -0.5；见下方各 joint 条目注释）。
  serial_port_front: /dev/ttyUSB0   # FR, FL legs
  serial_port_rear:  /dev/ttyUSB1   # RR, RL legs
  motor_hz: 1000.0
  # PD 增益是 SDK/转子侧（motor_bus 里 cmd.q 乘了 gear_ratio），
  # 所以关节刚度 K_joint = kp × gear_ratio²。甲方目标：关节 kp=20、kd=0.5。
  # 理论 kp = 20/gr²：hip/thigh(gr 6.33)→0.50 / kd 0.0125；calf(gr 12.66)→0.125 / kd 0.0031。
  # 旧结论作废：曾实测 kp=0.5 + mass 18~25 仍软趴，当时归因"tau_ff 开环量
  # 补不了比例刚度"——后来发现 _build_stance_tau 少了负号（τ=+J^T·f 是在把
  # 身体往下压，mass 越大压得越狠），实验前提就是错的。符号修正后
  # （τ=−J^T·R^T·f）tau_ff 真实承重，kp 下限需要重新实测——判据：开 tau_ff
  # 身高应微升（PD 静差被前馈消掉）而不是下降。
  # kp=1.0（K≈40，stance_scale 0.6 → 实际 K≈24）验证过不软趴。standup→balance
  # 的 tau/kp 阶跃已经用 _stance_entry_time 平滑过渡修掉了（mpc_node.py），
  # 走路卡顿也已用 mpc.kp_swing_scale 单独调低 + tick_hz 提到 100Hz 解决。
  # 实测确认 0.8 就站不起来了——0.8~1.0 之间是临界点，不要再往下降 kp。
  # 走路卡顿/超调不是 kp 的问题，是摆动轨迹本身振幅太大（step_height/落脚点
  # offset），下一步该调这些运动学参数而不是继续压 kp。
  # TODO(台架)：单关节挂已知重量、量角度偏差 Δθ，算 K_joint = τ/Δθ 确认 ≈20。
  #   关键：calf 的 gr² 是 hip/thigh 的 4 倍，所以 calf 的 kp/kd 已按 1/4 拆分。
  kp: 1.0 
  kd: 0.0333
  kp_calf: 0.20
  kd_calf: 0.0133
  gait_hz: 50.0   # policy control frequency
  max_joint_speed: 12.0   # rad/s (URDF frame) — safety cap on per-joint cmd delta.
                          # Set near hardware limit (dog_urdf joint vel 12-14 rad/s)
                          # so it only catches glitches, not normal trot swing.
  aggregator_hz: 200.0   # joint_aggregator publish rate (was: per-motor ≈12 kHz)
  estimator_hz: 200.0    # state_estimator publish rate (was: per-IMU ≈400 Hz)

teleop:
  # 【2026-07-11 放大速度试验】原 0.40/0.10/0.5。mpc_node 平地对 cmd_vel
  # 无二次限幅,遥控这里就是唯一上限;台阶模式(stair_mode/爬行步态)另有
  # 程序锁速 0.08/0.03/0.15,不受此处影响。0.60 m/s 对应支撑步幅 ±14cm,
  # 仍在 IK 可达范围内;若出现"IK miss"刷屏或摆动甩腿,先退回 0.40。
  max_vx:  0.60  # m/s  forward/backward
  max_vy:  0.20  # m/s  lateral
  max_yaw: 0.8   # rad/s yaw rate
  deadzone: 0.05  # joystick axis deadzone (fraction of full range)
  btn_posture_toggle: 0  # A button: toggle stand up / lie down
  axis_vx:  1
  axis_vy:  0
  axis_yaw: 3
  invert_vx:  false
  invert_vy:  false
  invert_yaw: true
  btn_emergency_stop: 1   # B button: hold → immediate lie-down to passive
  # 手动上台阶触发（2026-07-10,人当感知、程序管执行）:
  #   X(2) = 前腿对上一级:按下后 FR/FL 各自在下一次抬腿时把落脚目标抬高
  #          stair_rise(默认 0.10m),两条前腿自然依次消化;
  #   Y(3) = 后腿对上一级,同理——时机你自己看,后腿快到立板前按;
  #   X+Y 同时 = 清除所有腿的台阶偏移(应急退出,只在平地用)。
  #   四腿偏移出现公共部分(整级都上去了)会以 0.04m/s 自动归零 = 身体
  #   爬升到新一级的标准站姿,这是正常退出,自动发生,不用操作。
  #   未消化的按键 10 秒过期。配合 contact_detect_enabled(落地实测校准)
  #   与慢步频使用;一次只跨一级——前腿没等后腿跟上就再按会顶到 ±0.12m
  #   限幅并刷 IK miss。
  btn_step_front: 2
  btn_step_rear:  3
  axis_lt: 4
  axis_rt: 5
  max_dz:  0.03  # m/s height rate limit
  # Absolute stance-height command integrated from LT/RT (/height_command).
  # height_init must match mpc.stance_height — otherwise teleop connecting
  # drags the standing height toward its own initial value.
  height_min:  0.10
  height_max:  0.30
  height_init: 0.235   # 与 mpc.stance_height 同步（2026-07-10 降高度）

mpc:
  # tick_hz: mpc_node's own solve/publish rate — deliberately separate from
  # control.gait_hz (policy_node's RL loop, tuned to 50Hz for that policy).
  # Standup ramp looks smooth at 50Hz because it's slow (6s ramp → tiny
  # per-tick step); swing covers a full foot arc in ~0.24s, so 50Hz only
  # gives ~12 samples across it — visible as "discrete" stair-stepping,
  # made worse once kp_swing_scale was lowered (joint can't catch up before
  # the next step arrives). QP solve is the closed-form np.linalg.solve path
  # (~1ms per SRBDMPC docstring), so there's headroom to raise this well
  # above 50Hz; watch CPU/solve time on real hardware before going higher.
  tick_hz: 100.0
  # SRBD-MPC physical parameters (GRF feedforward on top of the position gait).
  # mass: 有效承重质量,站高标定得出（scripts/height_check.py，2026-07-09）：
  #   秤重 14.55 kg，但 m_true = 14.55×(H_cmd−H_off)/(H_on−H_off)
  #   = 14.55×13mm/13.8mm ≈ 13.6 —— 差值 ≈ 站立时小腿/足端质量直接落地。
  #   运行时可调：ros2 param set /mpc_node mass 13.6（看 height_check 的
  #   mean Δ 归零即为准）。
  # Inertia: URDF sums scaled by mass ratio — rough estimate.
  # 【2026-07-09】曾虚报 25.0 硬顶迈步塌陷——z_fb（见下）闭环后该 hack 反而
  # 有害：前馈恒多推 ~110N,高度环被迫顶着 ±5cm 误差限幅反向对抗,两边都失真。
  # z_fb 上线起 mass 回归标定真值,塌陷交给闭环补。
  mass:    13.6
  # 质心偏移（机体系，m，前 x+ / 左 y+）：QP 对质心取矩,默认假设质心在几何
  # 中心。实测站立（2026-07-09）前腿比指令矮 4mm、后腿反被顶高 4~7mm ——
  # 前馈给前腿少、后腿多,即真实质心偏前。站立开 tau_ff,每次 +0.01 上调
  # com_x（ros2 param set /mpc_node com_x 0.02）,直到 height_check 四腿
  # Δ 大致相等；左右不均则同法调 com_y。
  # 【2026-07-10 力臂修正后必须重标】QP 此前用髋系 FK 当力臂（前后 ±0.065m,
  # 真实 ±0.207m,少了 3 倍）——com_x 0.05 是在错误力臂下标出来的补偿值:
  # 实测平地水平站立 前 113N/后 24N（5:1!,正确物理应约 85/52),后腿长期
  # 欠支撑靠 PD 硬扛 = 站立"昂头"的静态底子。力臂修正后 0.05 变回真实质心
  # 偏移的含义,数值先沿用,开 tau 站立跑 height_check 重新按"四腿 Δ 相等"
  # 微调（预期最终值仍在 0.03~0.07 邻域）。
  com_x:   0.05
  com_y:   0.0
  Ixx:     0.0196
  Iyy:     0.0228
  Izz:     0.0169
  # 长前瞻（2026-07-10）：mpc_dt 是 MPC 内部预测步长,与 100Hz tick 解耦
  # （QP 每 tick 照常重解,只是往前看 mpc_dt×horizon）。此前 6×10ms 只看
  # 60ms——比一次换腿还短,QP 对即将到来的接触切换毫不知情,负载转移全靠
  # 事后 ramp 兜底,这就是 tau_ramp_frac/vz_fb_weight 上机调不动的结构性
  # 原因（0.1 反而更差：窗口内根本没有提前转移的力可交接）。
  # 0.025×8 = 200ms 正好覆盖一个完整摆动期：QP 在窗口内看到下一次触地/
  # 离地,提前把力向留下的腿转移。求解 ~2.5ms（原 1.5ms）,100Hz 预算内。
  # 【重要】QP 等效增益随视界变——下面 z_fb/vz_fb/rate_fb 权重已按新视界
  # 重标定,等效刚度与 07-09 硬件验证值一致（kz≈3200 N/m 不变,手感应
  # 连续）。改 mpc_dt 或 horizon 必须重跑离线标定再配权重。
  mpc_dt:  0.025
  horizon: 8
  # tau_ff 三层平滑保证任何切换都无阶跃：全局 0.3s blend（进 WALK / 运行时开关）、
  # 支撑相首尾 20% 力渐变（触地/离地瞬间该腿力为零）、输出 40ms 低通（吸收其余
  # 腿在接触切换时的受力重分配阶跃）。
  # 换腿力再分配（_apply_load_ramp）：渐变削掉的离地腿份额实时转给仍承重的腿，
  # 前馈合力恒等于 QP 解——此前 ramp 单纯把力乘系数，换腿窗口欠命令 ~70N，
  # 身体每步下塌 ~1.5cm 靠 PD 兜底（实测加 kp 塌陷不变、关 tau_ff 更差即此因）。
  # 运行时 A/B 对比：
  #   ros2 param set /mpc_node tau_ff_enabled false   # 0.3s 内平滑退出
  # tau_ff 验证有效后可逐步下调 kp_scale（2.0 → 1.0），让力矩承重、PD 提供柔顺。
  tau_ff_enabled: true
  gait_period:   0.8    # s — full stance+swing cycle per leg (trot)
  swing_ratio:   0.4    # fraction of gait_period spent in swing
  step_height:   0.04   # m — foot clearance at mid-swing
  # 0.27 → 0.235（2026-07-10 需求:再降 3~4cm）。起立终点跟随此值(IK 解),
  # 无跳变;LT/RT 仍可 0.15~0.30 现场调。注意 0.22 以下自动进低姿态外撇。
  # 与 teleop.height_init 必须一致。
  stance_height: 0.235  # m — nominal body height above feet
  # Pure position control: no GRF/tau_ff feedforward, one fixed kp/kd scale
  # for the whole gait cycle (no stance/swing gain switching). See
  # dev/mpc-purepos branch — removed SRBD-MPC + J^T·f torque path entirely
  # to isolate sim2real gap from PD tracking before reintroducing force control.
  # K_joint = base kp × kp_scale × gr²。电机峰值 23.7 Nm：位置误差 > 23.7/K 即
  # 力矩饱和。实测 4.5(K≈180) 走路时电机过流保护跳闸（"腿忽然断"）——触地几度
  # 误差就顶满力矩；2.0(K≈80) 支撑误差 ~0.05 rad、离饱和一倍余量。
  kp_scale: 1.5
  kd_scale: 2.0
  # "小kp大tau"分相增益：支撑腿随受力渐变把 kp/kd 交叉过渡到下面的低值
  # （前馈承重、PD 只管柔顺纠偏），摆动腿保持上面的 kp_scale/kd_scale 不变
  # ——摆动腿悬空没有 tau_ff，全靠 PD 跟轨迹，全局压 kp 时塌的正是它们。
  # 过渡权重 = 支撑力渐变 × tau 全局 blend：tau_ff 关闭/失效时支撑腿自动
  # 恢复硬 PD，不会出现"没前馈还软腿"。<=0 表示不启用（全程 kp_scale）。
  # 现场实验：ros2 param set /mpc_node kp_stance_scale 0.8，再逐步 0.6/0.5；
  # 塌 → 回调大一档。判据：height_check 站立 Δ 不变差、走路塌陷感减轻。
  # 【2026-07-11 反向用法转正】原设想是支撑相"压低"kp 让前馈承重,上机
  # 实测相反方向更好:支撑相偏软,调到 2.5(高于全局 1.5)明显更稳,写死。
  # K_stance ≈ 1.0×2.5×40 = 100,离过流红线 K≈180(kp_scale 4.5 实测跳闸)
  # 还有近一倍余量;再想加硬先试 3.0,别超 3.5。
  kp_stance_scale: 2.5
  kd_stance_scale: 2.0
  # 位置侧 IMU 调平（仅 WALK 相）：projected_gravity 倾斜量（0.1s 低通）+ 其
  # 数值微分 → 四脚 z 修正，±4cm 限幅 + 0.25 m/s 斜率硬限。
  # 【2026-07-09 实测确认：默认关闭】rate_fb（力级速率阻尼）上线后,这条慢环
  # 就是振荡源本身——0.1s 低通 + 微分再滤波在 2Hz 下滞后 ~83°,慢半拍地推,
  # 力环实时地刹,一推一刹手感"发涩/像大静摩擦";关掉立即丝滑。三个都置 0。
  # 唯一保留场景：纯力环姿态 P 有稳态误差,若站立长期停在小倾角上,加回
  # att_kp 0.03~0.04 只做静态 trim（kd/ki 必须保持 0,动态全交给 rate_fb）。
  # 历史标定备查：环路增益 = 2·att_kp/轮距(0.32m),0.16 即增益 1 必振荡。
  att_kp: 0.0
  att_kd: 0.0
  # 积分 trim：同上,已被 rate_fb 取代,保持 0。（旧症状备查：低频数秒缓摆
  # = 积分器"慢慢磨,攒够走一格"。限幅 ±0.03 m,估计失效 1s 泄漏归零。）
  att_ki: 0.0
  # IMU 安装偏角（rad）——"水平"的定义。两个调平环（位置 trim + MPC 姿态 P）
  # 都把"扣除该偏角后的倾斜"归零，偏角错了机身就被主动按在斜姿态上，而且
  # tau_ff 一开按得更狠（同一个错误零点、更大力气）——"总是前倾、开 tau 更
  # 前倾"即此症状。标定（站立、开 tau_ff、看 height_check）：
  #   前倾（鼻子低）→ att_pitch_offset 往负调，每次 0.01（≈0.6°），
  #   直到前/后腿 meas 高度相等；左右倾同法调 att_roll_offset。
  # 注意：别用 com_x 去顶前倾——com_x 只该按"四腿 Δ 相等"标定（≈0.05），
  # 拿它抬前身是在用错误的负载分配对抗错误的姿态零点，两个都失真。
  att_roll_offset:  0.0
  att_pitch_offset: 0.0
  # 机体角速度直接进 QP 状态（力级姿态阻尼，MIT 的"快通道"）：gyro 无滤波
  # 延迟，直接变成反向支撑力矩——位置侧调平（att_kp/kd，0.1s 低通 + 微分再
  # 滤波）在 2Hz 步频下相位滞后 ~83°，越调越晃的根源。轴向按标准约定
  # （x前/y左/z上，wx=ang_vel[0]）。风险自查：tau 一介入就出现越来越大的
  # 摆动 = 某轴符号反了（阻尼变正反馈）——
  #   ros2 param set /mpc_node rate_fb_enabled false   # 立即回退
  # 【2026-07-09 上机确认】方向正确、阻尼有效。
  # 【2026-07-10 更正】当时 Q 矩阵是整数数组,小数权重被静默截断——0.15/
  # 0.25/0.35 实验实际全是 0（阻尼整个关掉,所以"摇起来停不下"）,并非
  # "权重小了不够"。已修复（srbd_mpc.py Q 强制 float）,小数值现在真有效。
  # rate_fb_weight：wx/wy 误差的 QP 权重,即阻尼强度。长视界重标定：1.0 ≈
  # 原 60ms 视界下 2.0 的角度刚度（kangle≈9 Nm/rad 持平）；显式速率阻尼
  # krate 约为原来一半（1.0 vs 2.05 Nm/(rad/s)）,但长视界会把速率预测成
  # 未来角度自带提前刹车,总阻尼需上机验证——横向晃动若变明显,先试
  # 0.5（本征阻尼更强）再试 2,方向不同,别只往上加。
  rate_fb_enabled: true
  rate_fb_weight:  1.0
  # 【2026-07-10 力臂修正的连带】QP 调平力臂×3,同权重下姿态纠正力度×3——
  # 角度权重原来写死 200,现暴露成参数。调平过猛/一顿一顿:
  #   ros2 param set /mpc_node angle_fb_weight 65     # ≈修正前的等效刚度
  #   ros2 param set /mpc_node rate_fb_weight 0.35    # ≈修正前的等效阻尼
  # 若修正后的更强调平其实手感不错,保持 200/1.0 不动。
  angle_fb_weight: 200.0
  # z 反馈闭高度环：支撑腿 FK 实测机体高度 + 垂直速度（−J·q̇，按支撑力渐变
  # 加权,刚触地/将离地的腿自动不算数）喂进 QP 的 z/vz 通道——塌了误差自己
  # 变升力,总力不再依赖 mass 精确（此前迈步塌陷靠虚报 mass 25 硬顶即此因,
  # 已回归 13.6）。误差限幅 ±5cm、速度 ±0.4 m/s：接触误判骗不出大力。
  # z_fb_weight 即高度刚度。长视界重标定（2026-07-10）：800 @ 200ms 视界
  # ≈ 3200 N/m,与原 2000 @ 60ms 视界等效（长视界下力对 z 的在窗内作用
  # 更充分,同样刚度只需更小权重）。塌陷仍明显 → ×2 上调（1600/3200,
  # 出现上下弹跳/抖动 → 减半）；A/B：ros2 param set /mpc_node
  # z_fb_enabled false（退回纯 mass 前馈,0 误差 0 响应,无阶跃）。
  z_fb_enabled: true
  z_fb_weight:  800.0
  # 【2026-07-09 mpc_debug 实测】迈步塌陷不是刚度问题：站立 p95 ±1.6mm 完美,
  # 行走塌陷是 4Hz 锁相瞬态——触地后 0~90ms 塌到 ~13mm、200ms 恢复,正压在
  # 换腿力渐变窗口（支撑相首 20%=60ms）上,窗口内实际支撑缺口 ~40N。
  # 所以 z_fb_weight 2000/4000/8000 手感无差（刚度救不了 60ms 瞬态）。
  # 两个直接打这个窗口的旋钮（判据：mpc_debug_check 的 walking p95 sag）：
  # tau_ramp_frac —— 力渐变窗口占支撑相比例。
  #   【2026-07-10 上机结果】0.1 更差、vz 20/40 不明显——短视界下 QP 没有
  #   提前转移的力,ramp 加快只是把力更早压到还没承力的腿上。长前瞻
  #   （mpc_dt 见上）就是冲着这个来的:QP 提前看到换腿,ramp 只做执行侧
  #   平滑。上长前瞻后保持 0.2 起步,若交接干净了再试收窄。
  # vz_fb_weight —— QP 对实测垂直速度的权重（阻尼）。长视界重标定:5 ≈
  #   440 N/(m/s)（原 10 @ 60ms ≈ 570）。出现高频抖动/过阻尼憋滞 → 减半。
  tau_ramp_frac: 0.2
  vz_fb_weight:  5.0
  # QP 内 Δu 连续性代价（把第一步力锚在上一 tick 已发力上）。长前瞻下 QP 会
  # 在换腿前"泵力"蓄动量——这正是要的预载,默认不压制（0.0 = 关）。仅当上机
  # 出现明显"交接踢腿/咯噔"再开:1e-4 轻微(反馈保留 74%/tick),3e-4 中等
  # (49%)。别超 1e-3——那等于给反馈环再加一级 40ms 低通,4Hz 塌陷瞬态的
  # 相位余量直接减半,离线已验证(2026-07-10)。改后需重启节点(构造参数)。
  grf_slew_weight: 0.0
  # 地形自适应（2026-07-10,目标 ≤15° 全向坡,平地自动退化为原行为）。
  # 原理:支撑腿实测 FK 点（按受力渐变加权信任）→ 拟合地面平面（0.4s 低通,
  # 20° 坡度限幅）→ 两层输出,各自独立开关、0.3s 渐变切换（切换不产生阶跃）:
  # terrain_adapt_enabled —— 位置级:落脚/支撑目标的 z 按平面逐点偏移
  #   （±7cm 限幅）。这是"上坡第一步提前触地砸腿 / 下坡第一步踩空前栽"
  #   的正解:脚落在真实坡面高度上。已在坡上、身体已顺坡后偏移自动归零
  #   （体坐标系里坡面是平的）,稳态 = 平地行为。
  # terrain_att_ref_enabled —— 力级:QP 姿态基准从"水平"改为"平行坡面",
  #   不再持续把身体往水平扳（否则重量被挤向坡下腿）。增益本就弱
  #   （~9 Nm/rad）,风险低。
  # 排查:ros2 topic echo /mpc_debug 的 [14:15] = 世界系坡度 [a,b],
  #   平地 ≈0,15° 坡 ≈ ±0.27。平地走突然发飘/脚乱抬 → 先关位置层:
  #   ros2 param set /mpc_node terrain_adapt_enabled false
  # 【上坡注意】过渡段坡下腿要多伸最多 7cm:走坡时 stance_height 保持
  #   ≤0.27（0.27+0.07=0.34 < 腿全长 0.361,再高 IK 无解会刷 "IK miss"）。
  #   step_height 建议临时提到 0.04 防上坡蹭脚尖。
  # 【2026-07-10 晚,默认改关】平地实测:一走就歪、停步/起立后保持歪斜。
  # 机制:估计器分不清"地面形状"和"支撑力误差引起的腿压缩差"——com_x 是
  # 力臂修正前标的,前后腿前馈支撑不准 → 前后 PD 压缩差几毫米 → 拟合成
  # 假坡 → 姿态基准+落脚偏移把身体真掰歪(自我实现)。启用前置条件:
  # 先重标 com_x(站立开 tau 跑 height_check,四腿 Δ 相等),假坡源头消掉
  # 后再开这两个开关上坡试。斜坡session:
  #   ros2 param set /mpc_node terrain_adapt_enabled true
  #   ros2 param set /mpc_node terrain_att_ref_enabled true
  terrain_adapt_enabled: false
  terrain_att_ref_enabled: false
  # 低姿态外撇（2026-07-10）：站高压到 low_spread_start 以下后,髋外展、
  # 脚按 1:1 随高度下降往外撇（上限 low_spread_max),"蜥蜴式"低姿态。
  # 动机:低姿态下腿折叠太狠,膝盖敲地——h=0.16 时膝离地仅 ~8cm 且小腿角
  # −2.22 rad 离 −2.65 限位只剩 0.4,摆动再折就见底。外撇 6cm 等效腿伸展
  # 变长:膝盖 +2cm、小腿角退到 −1.92。上限 0.06 是髋限位 ±0.4 rad 决定的
  # （h=0.16/s=0.06 时 q1=0.32,给姿态修正留余量;再大会被限位夹住导致
  # 落脚偏内）。正常站高（>0.22）外撇为 0,基线行为不变。
  # 运行时:ros2 param set /mpc_node low_spread_max 0.08（慎,见上）
  low_spread_start: 0.22
  low_spread_max:   0.06
  # 触地检测（2026-07-10,台阶模块核心）。100mm 台阶意味着按时钟计划的触地
  # 高度每步可能错 ±50mm+：早触地(上台阶)→摆动下降段小腿力矩突增,冻结
  # 垂直目标不再往台阶里压;踩空(下台阶)→计划触地却无实测负载,以 0.15m/s
  # 向下探足至多 8cm,探到的深度成为该脚的"地面偏移",同时也是它下一步落脚
  # 的先验(300mm 踏面下一步大概率同级)。未触地的腿前馈力和估计器信任都
  # 被门控为 0——不对空气发力。
  # 依赖:joint_aggregator 需力矩透传版本(同日构建);无力矩遥测时自动降级
  # 为纯时钟并告警,不会误判"全部悬空"。
  # contact_tau_thresh: 小腿关节系力矩阈值(Nm)。标定:开检测慢走平地,
  #   摆动腿本底 ~1Nm,触地 4~6Nm;误报(摆动中就冻结)→ 调大;漏报(照旧
  #   砸脚)→ 调小。
  contact_detect_enabled: false
  contact_tau_thresh: 3.0
  # 台阶模式（2026-07-10,一个开关）：爬行步态(一次抬一腿,三脚常撑地,
  # 静态稳定,任意瞬间可停) + 重心侧移(抬腿前身体向支撑三角挪) + 程序锁速
  # (前进 ≤0.08m/s、横移 ≤0.03、转向 ≤0.15——摇杆只管走/停/方向,不管快慢)
  # + 抬脚定死 12cm 不随速度缩水 + 自动启用触地检测。
  # 【v2 修正】所有台阶参数跟随"实际步态",不跟开关:走路中切开关完全
  # 无效果,直到站定、步态真切成爬行才一起生效——v1 在行走中切会出现
  # trot 扛爬行参数的甩腿(已复现,危险)。周期下限 1.2→2.0s:摆动 0.48s,
  # 12cm 抬脚竖直峰速 ~0.8m/s(约平地 2 倍,v1 是 4 倍)。
  # 用法:【站定后】ros2 param set /mpc_node stair_mode true,摇杆正对
  # 台阶轻推;结束后站定 set false。慢是特性:10 级台阶约 1.5~2 分钟。
  stair_mode: false
  stair_rise: 0.10   # m — 每次 /step_command 抬升的台阶高度(100mm 台阶)

standup:
  ramp_duration: 5.0       # seconds for 0 → q_default smooth-step ramp
  lie_down_duration: 2.0   # seconds for current → 0 smooth-step ramp

height_scan:
  default_height: 0.30     # m — fallback when grid cell has no depth data
