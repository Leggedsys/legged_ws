# Robot configuration for quadruped with 12 Unitree GO-M8010-6 motors.
#
# gear_ratio: total reduction ratio from joint to motor shaft.
#   motor_bus_node divides readings by gear_ratio and multiplies commands by gear_ratio.
#   If omitted, falls back to sdk.queryGearRatio() (motor internal ratio only).
#
# PD gains are applied by the motor driver:
#   tau = kp * (target_q - q_actual) + kd * (0 - dq_actual)
#
# direction / zero_offset: URDF alignment.
#   q_urdf = direction * q_motor + zero_offset
#   direction:   +1 if motor positive direction == URDF positive direction, -1 if reversed.
#   zero_offset: static offset in URDF frame (rad); calibrated in passive mode.
#
# q_min / q_max: hardware angle limits in URDF frame (rad).
#   motor_command_bridge clips /joint_commands before converting to motor frame.
#
# Calibration procedure: see legged_control/test/README.md

joints:
  # Canonical order for observation/action vectors (index 0-11)
  - name: FR_hip
    motor_id: 0
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    -1
    zero_offset:  0.105

  - name: FR_thigh
    motor_id: 1
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  1.8
    direction:    -1
    zero_offset:  1.08

  - name: FR_calf
    motor_id: 2
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9   # symmetric with rear calves (was -0.27); see control: calf-limit note
    direction:    1
    zero_offset:  -2.7

  - name: FL_hip
    motor_id: 3
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    1
    zero_offset:  0.105

  - name: FL_thigh
    motor_id: 4
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  1.8
    direction:    1
    zero_offset:  1.08

  - name: FL_calf
    motor_id: 5
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9    # symmetric with rear calves (was -0.27); see control: calf-limit note
    direction:    -1
    zero_offset:  -2.7

  - name: RR_hip
    motor_id: 6
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    1
    zero_offset:  0.105

  - name: RR_thigh
    motor_id: 7
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  2.0
    direction:    -1
    zero_offset:  1.08

  - name: RR_calf
    motor_id: 11
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9
    direction:    1
    zero_offset:  -2.7

  - name: RL_hip
    motor_id: 9
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    -1
    zero_offset:  0.105

  - name: RL_thigh
    motor_id: 10
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  2.0
    direction:    1
    zero_offset:  1.08

  - name: RL_calf
    motor_id: 8
    gear_ratio: 12.66
    q_min: -2.65
    q_max: -0.9
    direction:    -1
    zero_offset:  -2.7

control:
  # 关节限位只有一道：motor_command_bridge 按本文件每关节 q_min/q_max 裁剪
  # /joint_commands（policy_node 内的 policy.yaml 软限位裁剪已在 aa900e2 移除）。
  # 四条腿保持对称。calf 上限四腿统一 -0.9（之前 -0.5；见下方各 joint 条目注释）。
  serial_port_front: /dev/ttyUSB0   # FR, FL legs
  serial_port_rear:  /dev/ttyUSB1   # RR, RL legs
  motor_hz: 1000.0
  # PD 增益是 SDK/转子侧（motor_bus 里 cmd.q 乘了 gear_ratio），
  # 所以关节刚度 K_joint = kp × gear_ratio²。甲方目标：关节 kp=20、kd=0.5。
  # 理论 kp = 20/gr²：hip/thigh(gr 6.33)→0.50 / kd 0.0125；calf(gr 12.66)→0.125 / kd 0.0031。
  # 旧结论作废：曾实测 kp=0.5 + mass 18~25 仍软趴，当时归因"tau_ff 开环量
  # 补不了比例刚度"——后来发现 _build_stance_tau 少了负号（τ=+J^T·f 是在把
  # 身体往下压，mass 越大压得越狠），实验前提就是错的。符号修正后
  # （τ=−J^T·R^T·f）tau_ff 真实承重，kp 下限需要重新实测——判据：开 tau_ff
  # 身高应微升（PD 静差被前馈消掉）而不是下降。
  # kp=1.0（K≈40，stance_scale 0.6 → 实际 K≈24）验证过不软趴。standup→balance
  # 的 tau/kp 阶跃已经用 _stance_entry_time 平滑过渡修掉了（mpc_node.py），
  # 走路卡顿也已用 mpc.kp_swing_scale 单独调低 + tick_hz 提到 100Hz 解决。
  # 实测确认 0.8 就站不起来了——0.8~1.0 之间是临界点，不要再往下降 kp。
  # 走路卡顿/超调不是 kp 的问题，是摆动轨迹本身振幅太大（step_height/落脚点
  # offset），下一步该调这些运动学参数而不是继续压 kp。
  # TODO(台架)：单关节挂已知重量、量角度偏差 Δθ，算 K_joint = τ/Δθ 确认 ≈20。
  #   关键：calf 的 gr² 是 hip/thigh 的 4 倍，所以 calf 的 kp/kd 已按 1/4 拆分。
  kp: 1.0 
  kd: 0.0333
  kp_calf: 0.20
  kd_calf: 0.0133
  gait_hz: 50.0   # policy control frequency
  max_joint_speed: 12.0   # rad/s (URDF frame) — safety cap on per-joint cmd delta.
                          # Set near hardware limit (dog_urdf joint vel 12-14 rad/s)
                          # so it only catches glitches, not normal trot swing.
  aggregator_hz: 200.0   # joint_aggregator publish rate (was: per-motor ≈12 kHz)
  estimator_hz: 200.0    # state_estimator publish rate (was: per-IMU ≈400 Hz)

teleop:
  max_vx:  0.40  # m/s  forward/backward
  max_vy:  0.10  # m/s  lateral
  max_yaw: 0.5   # rad/s yaw rate
  deadzone: 0.05  # joystick axis deadzone (fraction of full range)
  btn_posture_toggle: 0  # A button: toggle stand up / lie down
  axis_vx:  1
  axis_vy:  0
  axis_yaw: 3
  invert_vx:  false
  invert_vy:  false
  invert_yaw: true
  btn_emergency_stop: 1   # B button: hold → immediate lie-down to passive
  axis_lt: 4
  axis_rt: 5
  max_dz:  0.03  # m/s height rate limit
  # Absolute stance-height command integrated from LT/RT (/height_command).
  # height_init must match mpc.stance_height — otherwise teleop connecting
  # drags the standing height toward its own initial value.
  height_min:  0.15
  height_max:  0.30
  height_init: 0.27

mpc:
  # tick_hz: mpc_node's own solve/publish rate — deliberately separate from
  # control.gait_hz (policy_node's RL loop, tuned to 50Hz for that policy).
  # Standup ramp looks smooth at 50Hz because it's slow (6s ramp → tiny
  # per-tick step); swing covers a full foot arc in ~0.24s, so 50Hz only
  # gives ~12 samples across it — visible as "discrete" stair-stepping,
  # made worse once kp_swing_scale was lowered (joint can't catch up before
  # the next step arrives). QP solve is the closed-form np.linalg.solve path
  # (~1ms per SRBDMPC docstring), so there's headroom to raise this well
  # above 50Hz; watch CPU/solve time on real hardware before going higher.
  tick_hz: 100.0
  # SRBD-MPC physical parameters (GRF feedforward on top of the position gait).
  # mass: measured 14.55 kg (legs 1.5×4 + base 8.55; URDF under-reports).
  # Inertia: URDF sums scaled by mass ratio 14.55/10.92 — rough estimate.
  mass:    14.55
  Ixx:     0.0196
  Iyy:     0.0228
  Izz:     0.0169
  horizon: 6
  # tau_ff 三层平滑保证任何切换都无阶跃：全局 0.3s blend（进 WALK / 运行时开关）、
  # 支撑相首尾 20% 力渐变（触地/离地瞬间该腿力为零）、输出 40ms 低通（吸收其余
  # 腿在接触切换时的受力重分配阶跃）。运行时 A/B 对比：
  #   ros2 param set /mpc_node tau_ff_enabled false   # 0.3s 内平滑退出
  # tau_ff 验证有效后可逐步下调 kp_scale（2.0 → 1.0），让力矩承重、PD 提供柔顺。
  tau_ff_enabled: true
  gait_period:   0.4    # s — full stance+swing cycle per leg (trot)
  swing_ratio:   0.35    # fraction of gait_period spent in swing
  step_height:   0.05   # m — foot clearance at mid-swing
  stance_height: 0.27   # m — nominal body height above feet
  # Pure position control: no GRF/tau_ff feedforward, one fixed kp/kd scale
  # for the whole gait cycle (no stance/swing gain switching). See
  # dev/mpc-purepos branch — removed SRBD-MPC + J^T·f torque path entirely
  # to isolate sim2real gap from PD tracking before reintroducing force control.
  # K_joint = base kp × kp_scale × gr²。电机峰值 23.7 Nm：位置误差 > 23.7/K 即
  # 力矩饱和。实测 4.5(K≈180) 走路时电机过流保护跳闸（"腿忽然断"）——触地几度
  # 误差就顶满力矩；2.0(K≈80) 支撑误差 ~0.05 rad、离饱和一倍余量。
  kp_scale: 1.0
  kd_scale: 2.0
  # IMU 姿态调平（仅 WALK 相）：projected_gravity 的 x/y 分量为倾斜量（0.1s 低通
  # 滤触地噪声），阻尼取该滤波信号自身的数值微分——不用原始 gyro（其轴向取决于
  # IMU 安装朝向，猜错符号会变成快速正反馈，实测表现为微小倾斜即剧烈弹跳）。
  # PD 输出映射为四脚 z 修正（倾低侧伸腿顶回），±4cm 限幅 + 0.25 m/s 斜率硬限
  # （任何调参都不可能让脚"跳"）。att_kp 单位 m/单位倾斜；设 0 关闭。
  # 环路增益 = 2·att_kp/轮距(0.32m)：att_kp 0.16 即增益 1（必振荡，实测 0.25 时
  # 左右横跳）。安全范围 0.05~0.12，每次加 0.02；过修/振荡 → 先加 att_kd 再降 att_kp。
  att_kp: 0.08
  att_kd: 0.02
  # 积分修正：纯 P 稳态只能消掉 增益/(1+增益)≈1/3 的静态倾斜，剩余静差靠积分
  # 在 1~2s 内走完（之前收敛要 4~5s 就是在等 P 慢慢磨）。限幅 ±0.03 m 防饱和，
  # 估计失效时 1s 泄漏归零。若出现低频缓慢摆动（周期数秒）→ 减半 att_ki。
  att_ki: 0.10

standup:
  ramp_duration: 5.0       # seconds for 0 → q_default smooth-step ramp
  lie_down_duration: 2.0   # seconds for current → 0 smooth-step ramp

height_scan:
  default_height: 0.30     # m — fallback when grid cell has no depth data
