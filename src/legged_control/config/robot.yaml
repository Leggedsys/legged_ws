# Robot configuration for quadruped with 12 Unitree GO-M8010-6 motors.
#
# gear_ratio: total reduction ratio from joint to motor shaft.
#   motor_bus_node divides readings by gear_ratio and multiplies commands by gear_ratio.
#   If omitted, falls back to sdk.queryGearRatio() (motor internal ratio only).
#
# PD gains are applied by the motor driver:
#   tau = kp * (target_q - q_actual) + kd * (0 - dq_actual)
#
# direction / zero_offset: URDF alignment.
#   q_urdf = direction * q_motor + zero_offset
#   direction:   +1 if motor positive direction == URDF positive direction, -1 if reversed.
#   zero_offset: static offset in URDF frame (rad); calibrated in passive mode.
#
# q_min / q_max: hardware angle limits in URDF frame (rad).
#   motor_command_bridge clips /joint_commands before converting to motor frame.
#
# Calibration procedure: see legged_control/test/README.md

joints:
  # Canonical order for observation/action vectors (index 0-11)
  - name: FR_hip
    motor_id: 0
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    -1
    zero_offset:  0.105

  - name: FR_thigh
    motor_id: 1
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  1.8
    direction:    -1
    zero_offset:  1.08

  - name: FR_calf
    motor_id: 2
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9   # symmetric with rear calves (was -0.27); see control: calf-limit note
    direction:    1
    zero_offset:  -2.7

  - name: FL_hip
    motor_id: 3
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    1
    zero_offset:  0.105

  - name: FL_thigh
    motor_id: 4
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  1.8
    direction:    1
    zero_offset:  1.08

  - name: FL_calf
    motor_id: 5
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9    # symmetric with rear calves (was -0.27); see control: calf-limit note
    direction:    -1
    zero_offset:  -2.7

  - name: RR_hip
    motor_id: 6
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    1
    zero_offset:  0.105

  - name: RR_thigh
    motor_id: 7
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  2.0
    direction:    -1
    zero_offset:  1.08

  - name: RR_calf
    motor_id: 11
    gear_ratio: 12.66
    q_min: -2.65
    q_max:  -0.9
    direction:    1
    zero_offset:  -2.7

  - name: RL_hip
    motor_id: 9
    gear_ratio: 6.33
    q_min: -0.4
    q_max:  0.4
    direction:    -1
    zero_offset:  0.105

  - name: RL_thigh
    motor_id: 10
    gear_ratio: 6.33
    q_min: -0.5
    q_max:  2.0
    direction:    1
    zero_offset:  1.08

  - name: RL_calf
    motor_id: 8
    gear_ratio: 12.66
    q_min: -2.65
    q_max: -0.9
    direction:    -1
    zero_offset:  -2.7

control:
  # 关节限位只有一道：motor_command_bridge 按本文件每关节 q_min/q_max 裁剪
  # /joint_commands（policy_node 内的 policy.yaml 软限位裁剪已在 aa900e2 移除）。
  # 四条腿保持对称。calf 上限四腿统一 -0.9（之前 -0.5；见下方各 joint 条目注释）。
  serial_port_front: /dev/ttyUSB0   # FR, FL legs
  serial_port_rear:  /dev/ttyUSB1   # RR, RL legs
  motor_hz: 1000.0
  # PD 增益是 SDK/转子侧（motor_bus 里 cmd.q 乘了 gear_ratio），
  # 所以关节刚度 K_joint = kp × gear_ratio²。甲方目标：关节 kp=20、kd=0.5。
  # 理论 kp = 20/gr²：hip/thigh(gr 6.33)→0.50 / kd 0.0125；calf(gr 12.66)→0.125 / kd 0.0031。
  # 下面是手调值（约 3× 理论），跟踪日志验证过（kp1.5/kd0.05，RMS≈基线但偏差≈0）。
  # TODO(台架)：单关节挂已知重量、量角度偏差 Δθ，算 K_joint = τ/Δθ 确认 ≈20。
  #   关键：calf 的 gr² 是 hip/thigh 的 4 倍，所以 calf 的 kp/kd 应 ≈ hip/thigh 的 1/4。
  #   现状：kp 已按 1/4 拆分（1.5 / 0.375）；kd 仍为 0.4×（0.05 / 0.02），待继续调。
  kp: 0.5
  kd: 0.0125
  kp_calf: 0.125
  kd_calf: 0.0031
  gait_hz: 50.0   # policy control frequency
  max_joint_speed: 12.0   # rad/s (URDF frame) — safety cap on per-joint cmd delta.
                          # Set near hardware limit (dog_urdf joint vel 12-14 rad/s)
                          # so it only catches glitches, not normal trot swing.
  aggregator_hz: 200.0   # joint_aggregator publish rate (was: per-motor ≈12 kHz)
  estimator_hz: 200.0    # state_estimator publish rate (was: per-IMU ≈400 Hz)

teleop:
  max_vx:  0.60  # m/s  forward/backward
  max_vy:  0.05  # m/s  lateral
  max_yaw: 0.5   # rad/s yaw rate
  deadzone: 0.05  # joystick axis deadzone (fraction of full range)
  btn_posture_toggle: 0  # A button: toggle stand up / lie down
  axis_vx:  1
  axis_vy:  0
  axis_yaw: 3
  invert_vx:  false
  invert_vy:  false
  invert_yaw: true
  btn_emergency_stop: 1   # B button: hold → immediate lie-down to passive
  axis_lt: 4
  axis_rt: 5
  max_dz:  0.03  # m/s height rate limit

mpc:
  # Physical parameters for SRBD-MPC.
  # mass: measured — each leg 1.5 kg × 4 + base 8.55 kg = 14.55 kg.
  # (URDF under-reports base mass; URDF total was 10.92 kg.)
  mass:    14.55
  # Diagonal body-frame inertia (kg⋅m²): URDF summed values scaled by
  # actual/URDF mass ratio (14.55/10.92 ≈ 1.33). Rough estimate only —
  # replace with system-ID result if oscillation is observed.
  Ixx:    0.0196
  Iyy:    0.0228
  Izz:    0.0169
  horizon: 6    # MPC prediction steps (N=6 → ~10ms solve on laptop; raise if tracking diverges)
  K_joint: 20.0 # effective joint stiffness (Nm/rad) used for GRF→Δq mapping (kp × gear_ratio²)
  # MIT Cheetah 动态增益：比例系数相对各关节现有 kp/kd 基准值
  # 支撑相低刚度让 tau_ff 主导，摆动相高刚度精确跟踪轨迹
  kp_stance_scale: 0.25
  kd_stance_scale: 1.0
  kp_swing_scale:  2.0
  kd_swing_scale:  2.0

standup:
  ramp_duration: 6.0       # seconds for 0 → q_default smooth-step ramp
  lie_down_duration: 2.0   # seconds for current → 0 smooth-step ramp

height_scan:
  default_height: 0.30     # m — fallback when grid cell has no depth data
